name: Build Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r monitor_hub/requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller monitor_hub.spec

      - name: Verify exe exists
        run: |
          if (!(Test-Path "dist\monitor_hub.exe")) {
            Write-Error "Build failed: monitor_hub.exe not found"
            exit 1
          }
          Write-Host "Build OK: $(Get-Item dist\monitor_hub.exe | Select-Object -ExpandProperty Length) bytes"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor_hub-exe
          path: dist\monitor_hub.exe
          retention-days: 7
