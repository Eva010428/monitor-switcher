name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r monitor_hub/requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller monitor_hub.spec

      - name: Package release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "monitor_hub-$tag-windows.zip"
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\monitor_hub.exe          release\
          Copy-Item monitor_hub\config.example.json release\
          Copy-Item README.md                      release\
          Compress-Archive -Path release\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
